name: Deploy Production Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on v1.0.0, v2.1.3, etc.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for GCP Workload Identity Federation (OIDC)
  security-events: write # Required to upload SARIF security scans to the Security tab

env:
  SERVICE_NAME: qwintly-wg-worker
  IMAGE_NAME: qwintly-wg-worker

jobs:
  release:
    name: Production Release
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WORKER_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_QWINTLY }}

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      # 2. Local Container Build & Scan
      - name: Build local container image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}-local:latest .

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}-local:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      # 3. Retag and Push to GCP Artifact Registry
      - name: Tag & Push to Artifact Registry
        run: |
          REMOTE_IMAGE="${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_QWINTLY }}/qwintly-images/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker tag ${{ env.IMAGE_NAME }}-local:latest $REMOTE_IMAGE
          docker push $REMOTE_IMAGE

      # 4. Deploy production container
      - name: Deploy to Cloud Run (Prod)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_QWINTLY }}/qwintly-images/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --region=asia-south1 \
            --platform=managed \
            --service-account=${{ vars.WORKER_SA_EMAIL }} \
            --allow-unauthenticated \
            --set-env-vars GCP_PROJECT_ID_QWINTLY=${{ vars.GCP_PROJECT_ID_QWINTLY }},PUBSUB_PUSH_AUDIENCE=${{ vars.PUBSUB_PUSH_AUDIENCE }},NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},UPSTASH_REDIS_REST_URL_GEN_EVENTS=${{ vars.UPSTASH_REDIS_REST_URL_GEN_EVENTS }} \
            --set-secrets SUPABASE_SECRET_KEY=supabase-secret-key:latest,UPSTASH_REDIS_REST_TOKEN_GEN_EVENTS=upstash-redis-rest-token-gen-events:latest,PUBLISH_SECRET=publish-secret:latest \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=1 \
            --timeout=3600 \
            --cpu=1 \
            --memory=1Gi
